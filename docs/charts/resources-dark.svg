<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="960" height="312" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>各模型的内存、耗时与 GPU 开销</title><desc>qwen3.6-35b-a3b: 19 GB, 3 s, 12.4 GPU-s; hy-mt2-7b: 5.7 GB, 3 s, 14.7 GPU-s; hy-mt2-1.8b: 2.4 GB, 0.9 s, 4.1 GPU-s; milmmt-46-1b: 1.2 GB, 0.9 s, n/a GPU-s</desc>
<rect x="0.5" y="0.5" width="959" height="311" rx="10" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#ffffff">三项硬件开销：条越短越省</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">Apple M5 Pro · 同一组 15 句口语化字幕 · 每列各自的刻度</text><text x="190" y="82" font-size="13" font-weight="600" fill="#ffffff">常驻内存<tspan font-weight="400" fill="#898781">  GB</tspan></text><line x1="190" y1="92" x2="190" y2="264" stroke="#383835"/><path d="M190,107 h166 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-166 z" fill="#3987e5"/><text x="368" y="119" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">19</text><path d="M190,151 h47 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-47 z" fill="#3987e5"/><text x="249" y="163" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">5.7</text><path d="M190,195 h17.473684210526315 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-17.473684210526315 z" fill="#3987e5"/><text x="219.4736842105263" y="207" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">2.4</text><path d="M190,239 h6.7368421052631575 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-6.7368421052631575 z" fill="#3987e5"/><text x="208.73684210526315" y="251" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">1.2</text><text x="440" y="82" font-size="13" font-weight="600" fill="#ffffff">翻译 15 句耗时<tspan font-weight="400" fill="#898781">  秒</tspan></text><line x1="440" y1="92" x2="440" y2="264" stroke="#383835"/><path d="M440,107 h166 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-166 z" fill="#3987e5"/><text x="618" y="119" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">3.0</text><path d="M440,151 h166 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-166 z" fill="#3987e5"/><text x="618" y="163" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">3.0</text><path d="M440,195 h47 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-47 z" fill="#3987e5"/><text x="499" y="207" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">0.9</text><path d="M440,239 h47 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-47 z" fill="#3987e5"/><text x="499" y="251" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">0.9</text><text x="690" y="82" font-size="13" font-weight="600" fill="#ffffff">每 100 句占用 GPU<tspan font-weight="400" fill="#898781">  GPU·秒</tspan></text><line x1="690" y1="92" x2="690" y2="264" stroke="#383835"/><path d="M690,107 h139.4013605442177 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-139.4013605442177 z" fill="#3987e5"/><text x="841.4013605442177" y="119" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">12.4</text><path d="M690,151 h166 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-166 z" fill="#3987e5"/><text x="868" y="163" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">14.7</text><path d="M690,195 h43.414965986394556 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-43.414965986394556 z" fill="#3987e5"/><text x="745.4149659863946" y="207" font-size="13" fill="#ffffff" font-variant-numeric="tabular-nums">4.1</text><text x="698" y="251" font-size="12" fill="#898781">未测</text><text x="24" y="110" font-size="13" font-weight="600" fill="#ffffff">qwen3.6-35b-a3b</text><text x="24" y="126" font-size="11.5" fill="#898781">通用 MoE 大模型</text><line x1="24" y1="136" x2="936" y2="136" stroke="#2c2c2a"/><text x="24" y="154" font-size="13" font-weight="600" fill="#ffffff">hy-mt2-7b</text><text x="24" y="170" font-size="11.5" fill="#898781">翻译专用</text><line x1="24" y1="180" x2="936" y2="180" stroke="#2c2c2a"/><text x="24" y="198" font-size="13" font-weight="600" fill="#ffffff">hy-mt2-1.8b</text><text x="24" y="214" font-size="11.5" fill="#898781">翻译专用</text><line x1="24" y1="224" x2="936" y2="224" stroke="#2c2c2a"/><text x="24" y="242" font-size="13" font-weight="600" fill="#ffffff">milmmt-46-1b</text><text x="24" y="258" font-size="11.5" fill="#898781">翻译专用，未采用</text><text x="24" y="296" font-size="11.5" fill="#898781">「每 100 句占用 GPU」= 连续翻译约 10 秒期间的平均 GPU 利用率 × 耗时 ÷ 句数。milmmt 测完即移除，没有采样 GPU。</text>
</svg>
